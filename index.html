<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#14b8a6">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="description" content="Aplikasi buku kas sederhana untuk mencatat pemasukan dan pengeluaran">
    <title>Buku Kas Sederhana</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

    <!-- jsPDF + AutoTable (LOKAL) -->
    <script src="jspdf.min.js"></script>
    <script src="jspdf-autotable.min.js"></script>

    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📒</text></svg>">
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Buku Kas Sederhana</h1>

            <!-- Filter Periode -->
            <div class="filter-container">
                <div class="filter-item">
                    <label class="filter-label">Bulan</label>
                    <select id="filterMonth" class="filter-input">
                        <option value="">Semua</option>
                    </select>
                </div>
                <div class="filter-item">
                    <label class="filter-label">Tahun</label>
                    <input type="number" id="filterYear" class="filter-input" value="2026" min="2000" max="2100" inputmode="numeric">
                </div>
            </div>

            <!-- Ringkasan -->
            <div class="summary-container">
                <div class="summary-card summary-income">
                    <div class="summary-label">Pemasukan</div>
                    <div class="summary-value" id="totalIncome">Rp0</div>
                </div>
                <div class="summary-card summary-expense">
                    <div class="summary-label">Pengeluaran</div>
                    <div class="summary-value" id="totalExpense">Rp0</div>
                </div>
                <div class="summary-card summary-balance">
                    <div class="summary-label">Saldo</div>
                    <div class="summary-value" id="totalBalance">Rp0</div>
                </div>
            </div>

            <!-- Form Input Transaksi -->
            <div class="form-container">
                <div class="form-row">
                    <div class="form-group form-group-date">
                        <label class="form-label">Tanggal</label>
                        <input type="date" id="inputDate" class="form-input">
                    </div>
                    <div class="form-group form-group-type">
                        <label class="form-label">Jenis</label>
                        <select id="inputType" class="form-input">
                            <option value="income">Pemasukan</option>
                            <option value="expense">Pengeluaran</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Keterangan</label>
                        <input type="text" id="inputDesc" class="form-input" placeholder="Contoh: Uang saku" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Jumlah</label>
                        <input type="text" id="inputAmount" class="form-input input-number" placeholder="0" inputmode="numeric" autocomplete="off">
                    </div>
                </div>
                <button type="button" class="btn btn-add" id="addTransactionBtn">+ Tambah Transaksi</button>
            </div>

            <!-- Tabel Transaksi -->
            <div class="table-wrapper">
                <table id="transactionTable">
                    <thead>
                        <tr>
                            <th>No</th>
                            <th>Tanggal</th>
                            <th>Keterangan</th>
                            <th>Pemasukan</th>
                            <th>Pengeluaran</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <!-- Baris ditambahkan oleh JS -->
                    </tbody>
                </table>
            </div>

            <!-- Tombol Aksi -->
            <div class="button-group">
                <button type="button" class="btn btn-clear" id="clearAllBtn">Hapus Semua</button>
                <button type="button" class="btn btn-generate" id="generatePDFBtn">Generate PDF</button>
            </div>

            <!-- Tombol Install PWA (muncul otomatis di Android & Windows) -->
            <button type="button" class="btn btn-install" id="installBtn" style="display:none;">
                📲 Instal Aplikasi
            </button>

            <div id="errorMessages" class="error-messages"></div>
            <div id="successMessage" class="success-message"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
